name: Set up environment
description: Create the environment and export the run prefix. A repo with a pixi manifest gets its pixi env, any other repo a uv venv. Library mode installs the built wheel into it.
inputs:
  mode:
    description: library (install a built wheel into the env) or project (use the env as is). Project mode needs a pixi manifest.
    required: true
  python-version:
    description: Python version of the uv venv. Required for uv repos, unused for pixi repos.
    default: ''
  extras:
    description: Comma-separated extras installed with the wheel. uv repos only, a pixi env brings its own dependencies.
    default: dev
  uv-locked:
    description: uv repos in library mode. Install dependencies from uv.lock with uv sync before the wheel.
    default: 'true'
  cooldown:
    description: uv repos in library mode without uv-locked. Ignore PyPI releases newer than this age, e.g. 7d. Empty disables.
    default: 7d
  wheel-dir:
    description: Directory, relative to working-directory or absolute, that holds exactly one wheel.
    default: dist
  manifest-path:
    description: pixi manifest, relative to working-directory. Default pixi.toml, else pyproject.toml with a [tool.pixi] table.
    default: ''
  pixi-environment:
    description: pixi environment of pixi repos.
    default: default
  pixi-version:
    description: pixi version.
    default: v0.81.0
  vars-json:
    description: Pass toJSON(vars).
    default: '{}'
  vars-env:
    description: Space-separated variable names to export as env vars.
    default: ''
  working-directory:
    description: Directory of the caller package or project.
    default: .
outputs:
  run:
    description: Command prefix that runs a command inside the environment. Empty for uv repos, whose venv is on PATH.
    value: ${{ steps.pixi-run.outputs.run }}
  backend:
    description: pixi or uv.
    value: ${{ steps.backend.outputs.backend }}
runs:
  using: composite
  steps:
    - name: Mode check
      if: inputs.mode != 'library' && inputs.mode != 'project'
      shell: bash
      run: |
        echo "::error::mode must be library or project" >&2
        exit 1

    - if: inputs.vars-env != ''
      uses: $/.github/actions/vars-env
      with:
        vars-json: ${{ inputs.vars-json }}
        names: ${{ inputs.vars-env }}

    - id: backend
      uses: $/.github/actions/env-backend
      with:
        manifest-path: ${{ inputs.manifest-path }}
        working-directory: ${{ inputs.working-directory }}

    - name: Validate inputs
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BACKEND: ${{ steps.backend.outputs.backend }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        UV_LOCKED: ${{ inputs.uv-locked }}
        COOLDOWN: ${{ inputs.cooldown }}
      run: |
        set -euo pipefail
        if [ "$MODE" = project ]; then
          [ "$BACKEND" = pixi ] || { echo "::error::project mode needs pixi.toml or a [tool.pixi] table in pyproject.toml" >&2; exit 1; }
          exit 0
        fi
        [ "$BACKEND" = pixi ] || [ -n "$PYTHON_VERSION" ] || { echo "::error::python-version is required for a uv repo in library mode" >&2; exit 1; }
        [ "$UV_LOCKED" = true ] || [ "$UV_LOCKED" = false ] || { echo "::error::uv-locked must be true or false, got '$UV_LOCKED'" >&2; exit 1; }
        [[ "$COOLDOWN" =~ ^([0-9]+d)?$ ]] || { echo "::error::cooldown must be empty or a number of days such as 7d, got '$COOLDOWN'" >&2; exit 1; }

    - name: Locate wheel
      id: wheel
      if: inputs.mode == 'library'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WHEEL_DIR: ${{ inputs.wheel-dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=("${WHEEL_DIR//\\//}"/*.whl)
        [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected one wheel in $WHEEL_DIR, found ${#wheels[@]}" >&2; exit 1; }
        echo "path=${wheels[0]}" >>"$GITHUB_OUTPUT"

    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      if: steps.backend.outputs.backend == 'pixi'
      with:
        pixi-version: ${{ inputs.pixi-version }}
        manifest-path: ${{ steps.backend.outputs.manifest }}
        environments: ${{ inputs.pixi-environment }}
        locked: true
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    - name: pixi run prefix
      id: pixi-run
      if: steps.backend.outputs.backend == 'pixi'
      shell: bash
      env:
        MANIFEST: ${{ steps.backend.outputs.manifest }}
        PIXI_ENVIRONMENT: ${{ inputs.pixi-environment }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        run="pixi run --manifest-path $MANIFEST -e $PIXI_ENVIRONMENT"
        # --as-is keeps pixi from syncing the env back to the lock file over the installed wheel.
        [ "$MODE" = project ] || run="$run --as-is"
        echo "run=$run" >>"$GITHUB_OUTPUT"

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      if: inputs.mode == 'library'
      with:
        python-version: ${{ steps.backend.outputs.backend == 'uv' && inputs.python-version || '' }}
        enable-cache: ${{ steps.backend.outputs.backend == 'uv' }}
        cache-dependency-glob: |
          ${{ inputs.working-directory }}/pyproject.toml
          ${{ inputs.working-directory }}/uv.lock

    - name: Install wheel into the pixi env
      if: inputs.mode == 'library' && steps.backend.outputs.backend == 'pixi'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RUN: ${{ steps.pixi-run.outputs.run }}
        WHEEL: ${{ steps.wheel.outputs.path }}
      run: |
        set -euo pipefail
        python=$($RUN python -c 'import sys; print(sys.executable)')
        python="${python%$'\r'}"
        uv pip install --python "$python" --no-deps --reinstall "$WHEEL"

    - name: Install uv environment
      if: inputs.mode == 'library' && steps.backend.outputs.backend == 'uv'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        EXTRAS: ${{ inputs.extras }}
        UV_LOCKED: ${{ inputs.uv-locked }}
        WHEEL: ${{ steps.wheel.outputs.path }}
        COOLDOWN: ${{ inputs.cooldown }}
      run: |
        set -euo pipefail
        extras="${EXTRAS//[[:space:]]/}"
        venv="${RUNNER_TEMP//\\//}/uv-env"
        uv venv --python "$PYTHON_VERSION" "$venv"
        if [ "$RUNNER_OS" = Windows ]; then echo "$venv/Scripts" >>"$GITHUB_PATH"; else echo "$venv/bin" >>"$GITHUB_PATH"; fi
        echo "VIRTUAL_ENV=$venv" >>"$GITHUB_ENV"
        export VIRTUAL_ENV="$venv"
        if [ "$UV_LOCKED" = true ]; then
          [ -f uv.lock ] || { echo "::error::uv-locked is true but uv.lock is missing. Commit one or set uv-locked: false" >&2; exit 1; }
          extra_args=()
          IFS=',' read -ra extra_list <<<"$extras"
          for extra in ${extra_list[@]+"${extra_list[@]}"}; do
            [ -z "$extra" ] || extra_args+=(--extra "$extra")
          done
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --no-install-project ${extra_args[@]+"${extra_args[@]}"}
          uv pip install --no-deps "$WHEEL"
        else
          [ -z "$COOLDOWN" ] || export UV_EXCLUDE_NEWER="$COOLDOWN"
          uv pip install "$WHEEL${extras:+[$extras]}"
        fi

    - name: Export RUN
      shell: bash
      env:
        RUN: ${{ steps.pixi-run.outputs.run }}
      run: echo "RUN=$RUN" >>"$GITHUB_ENV"
