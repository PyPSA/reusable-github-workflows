name: Swap package in pypsa-eur
description: Replace a package in a pypsa-eur pixi workspace with a git revision.
inputs:
  package:
    description: Package name to replace. Empty means the name of the repository that runs the workflow.
    default: ''
  repository:
    description: GitHub repository (owner/name) to install the package from.
    required: true
  rev:
    description: Commit SHA (40 hex chars) or branch to install.
    required: true
  also-upgrade:
    description: Space-separated packages to upgrade afterwards. They and the swapped package skip the pypsa-eur exclude-newer cooldown.
    default: ''
  working-directory:
    description: pypsa-eur checkout.
    default: .
runs:
  using: composite
  steps:
    - name: Swap package
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE: ${{ inputs.package }}
        REPOSITORY: ${{ inputs.repository }}
        REV: ${{ inputs.rev }}
        ALSO_UPGRADE: ${{ inputs.also-upgrade }}
      run: |
        set -euo pipefail
        PACKAGE="${PACKAGE:-${GITHUB_REPOSITORY#*/}}"
        awk -v pkgs="$PACKAGE $ALSO_UPGRADE" '
          function exempt() { for (i = 1; i <= n; i++) print "\"" p[i] "\" = \"0d\""; done = 1 }
          BEGIN { n = split(pkgs, p, " "); for (i = 1; i <= n; i++) skip[p[i]] = 1 }
          /^\[/ { section = $1 }
          section == "[exclude-newer]" { key = $1; gsub(/"/, "", key); if (key in skip) next }
          { print }
          $1 == "[exclude-newer]" { exempt() }
          END { if (!done) { print ""; print "[exclude-newer]"; exempt() } }
        ' pixi.toml >pixi.toml.new
        mv pixi.toml.new pixi.toml
        pixi remove "$PACKAGE"
        if [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then ref_flag=--rev; else ref_flag=--branch; fi
        pixi add --pypi --git "https://github.com/$REPOSITORY.git" "$PACKAGE" "$ref_flag" "$REV"
        read -ra upgrade <<<"$ALSO_UPGRADE"
        if [ "${#upgrade[@]}" -gt 0 ]; then pixi upgrade "${upgrade[@]}"; fi
        pixi list "$PACKAGE"
