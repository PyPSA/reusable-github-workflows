name: PyPSA-Eur

on:
  workflow_call:
    inputs:
      package:
        type: string
        default: ""
        description: Package name in the PyPSA-Eur pixi manifest. Empty means the caller repo name.
      repository:
        type: string
        default: ""
        description: Repository (owner/name) to install the package from. Empty means the caller repo, or the PR head repo.
      rev:
        type: string
        default: ""
        description: Commit SHA or branch to install. Empty means the PR head SHA or the pushed SHA.
      pypsa-eur-ref:
        type: string
        default: master
        description: Branch, tag or SHA of PyPSA/pypsa-eur.
      task:
        type: string
        default: integration-tests-streamlined
        description: Pixi task to run in PyPSA-Eur.
      also-upgrade:
        type: string
        default: ""
        description: Space-separated packages to upgrade after the swap, e.g. linopy.
      paths:
        type: string
        default: ""
        description: Space- or newline-separated path globs. The run starts only if a change matches. Empty means always run. Schedule and dispatch events always run.
      vars-env:
        type: string
        default: ""
        description: Space-separated repository or organization variable (`vars`) names to export to the job env.
    secrets:
      CDSAPI_KEY:
        required: false
      EARTHDATAHUB_API_KEY:
        required: false
      MOSEKLM_LICENSE_FILE:
        required: false
      GUROBI_LIC:
        required: false

permissions: {}

jobs:
  pypsa-eur:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SNAKEMAKE_STORAGE_CACHED_HTTP_CACHE: ""
      SNAKEMAKE_STORAGE_CACHED_HTTP_SKIP_REMOTE_CHECKS: "1"
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::pull_request_target runs fork code with secrets. Use pull_request." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.paths != ''
        with:
          persist-credentials: false
      - id: filters
        if: inputs.paths != ''
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          set -f
          {
            echo "filters<<EOF_FILTERS"
            echo "src:"
            for glob in $PATHS; do echo "  - '$glob'"; done
            echo "EOF_FILTERS"
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: inputs.paths != ''
        with:
          filters: ${{ steps.filters.outputs.filters }}
      - id: gate
        env:
          PATHS: ${{ inputs.paths }}
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.changes.outputs.src }}
        run: |
          set -euo pipefail
          if [ -z "$PATHS" ] || [ "$CHANGED" = true ] || [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No matching changes. Skip the PyPSA-Eur run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: $/.github/actions/vars-env
        if: steps.gate.outputs.run == 'true' && inputs.vars-env != ''
        with:
          vars-json: ${{ toJSON(vars) }}
          names: ${{ inputs.vars-env }}
      - if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a --force
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          repository: PyPSA/pypsa-eur
          ref: ${{ inputs.pypsa-eur-ref }}
          path: pypsa-eur
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        if: steps.gate.outputs.run == 'true'
        with:
          pixi-version: v0.81.0
          manifest-path: pypsa-eur/pixi.toml
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - id: keys
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "week=$(date +'%Y%U')" >> "$GITHUB_OUTPUT"
          echo "month=$(date +'%Y%m')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: pypsa-eur/data
          key: pypsa-eur-data-${{ steps.keys.outputs.week }}-${{ hashFiles('pypsa-eur/data/versions.csv') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: pypsa-eur/cutouts
          key: pypsa-eur-cutouts-${{ steps.keys.outputs.month }}
      - if: steps.gate.outputs.run == 'true'
        working-directory: pypsa-eur
        run: git checkout HEAD -- data/
      - uses: $/.github/actions/pypsa-eur-swap
        if: steps.gate.outputs.run == 'true'
        with:
          package: ${{ inputs.package }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}
          rev: ${{ inputs.rev || github.event.pull_request.head.sha || github.sha }}
          also-upgrade: ${{ inputs.also-upgrade }}
          working-directory: pypsa-eur
      - if: steps.gate.outputs.run == 'true'
        working-directory: pypsa-eur
        env:
          TASK: ${{ inputs.task }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EARTHDATAHUB_API_KEY: ${{ secrets.EARTHDATAHUB_API_KEY }}
          MOSEKLM_LICENSE_FILE: ${{ secrets.MOSEKLM_LICENSE_FILE }}
          GUROBI_LIC: ${{ secrets.GUROBI_LIC }}
        run: pixi run "$TASK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: pypsa-eur-results
          path: |
            pypsa-eur/logs
            pypsa-eur/.snakemake/log
            pypsa-eur/results
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
